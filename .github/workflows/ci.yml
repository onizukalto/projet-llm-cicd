name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests unitaires et mocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lancer pytest
        run: pytest -v

  evals:
    name: Contrôle qualité avec le vrai modèle
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Mettre en cache le modèle Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-0.5b-instruct

      - name: Évaluer l'agent v1
        run: python run_evals_ci.py --agent v1

      - name: Évaluer l'agent v3
        run: python run_evals_ci.py --agent v3

      - name: Conserver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval_report_*.json
